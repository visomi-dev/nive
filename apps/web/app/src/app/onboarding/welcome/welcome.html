<section class="mx-auto w-full max-w-2xl space-y-6 py-6 sm:py-10" aria-labelledby="welcome-title">
  <header class="space-y-3">
    <h1 appUI appNavigationHeading id="welcome-title" i18n="@@firstUseTitle">What would you like to organize first?</h1>

    <p appUI tone="muted" i18n="@@firstUseIntroduction">Welcome to Nive. You can get started on your own.</p>
  </header>

  <div class="flex flex-wrap gap-2">
    <a
      appUI="button"
      routerLink="/personal"
      [queryParams]="{ setup: 'choose' }"
      [replaceUrl]="true"
      i18n="@@onboardingBring"
    >
      Bring my transactions
    </a>

    <a appUI="button" variant="secondary" routerLink="/home" [replaceUrl]="true" i18n="@@onboardingManual">
      Start without files
    </a>
  </div>

  <div appUI="card" layout="plain" class="space-y-2">
    <h2 appUI uiSize="sm" i18n="@@firstUseExampleTitle">Explore an example</h2>

    <p appUI tone="muted" i18n="@@firstUseExampleDescription">See how the dashboard looks with sample data.</p>

    <a appUI="button" variant="secondary" href="home#example-dashboard" i18n="@@firstUseOpenExample">
      Open example dashboard
    </a>
  </div>
</section>
