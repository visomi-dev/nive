# Disposable dependencies for the personal-import walkthrough. Supply a unique project with -p.
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: local_agent_test
      POSTGRES_USER: local_agent_fixture
      POSTGRES_PASSWORD: synthetic-compose-only
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'local_agent_fixture', '-d', 'local_agent_test']
      interval: 1s
      timeout: 3s
      retries: 30
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.22.3@sha256:21c9efd1077e9c282903647526c3bf57b30567c1e87270b7c81cd1e436e0333a
    ports:
      - '127.0.0.1::8025'
      - '127.0.0.1::1025'
volumes:
  postgres:
